_format_version: "3.0"

services:
  - name: lead-service
    url: http://lead-service:4001/leads

    routes:
      - name: lead-api
        paths:
          - /api/leads
        strip_path: true

  - name: customer-service
    url: http://customer-service:4002/customers

    routes:
      - name: customer-api
        paths:
          - /api/customers
        strip_path: true

  - name: service-service
    url: http://service-service:4003/services

    routes:
      - name: service-api
        paths:
          - /api/services
        strip_path: true

  - name: identity-service
    url: http://identity-service:4004/auth

    routes:
      - name: identity-api
        paths:
          - /api/auth
        strip_path: true

  - name: dashboard-service
    url: http://dashboard-service:4005/dashboard

    routes:
      - name: dashboard-api
        paths:
          - /api/dashboard
        strip_path: true

  - name: email-service
    url: http://email-service:4006/emails

    routes:
      - name: email-api
        paths:
          - /api/emails
        strip_path: true
  # identity-service also serves user, role and organization administration.
  # Each needs its own service entry because the upstream url carries the path
  # prefix that strip_path removes, exactly as with the services above.
  - name: identity-users
    url: http://identity-service:4004/users

    routes:
      - name: identity-users-api
        paths:
          - /api/users
        strip_path: true

  - name: identity-roles
    url: http://identity-service:4004/roles

    routes:
      - name: identity-roles-api
        paths:
          - /api/roles
        strip_path: true

  - name: identity-permissions
    url: http://identity-service:4004/permissions

    routes:
      - name: identity-permissions-api
        paths:
          - /api/permissions
        strip_path: true

  - name: identity-organizations
    url: http://identity-service:4004/organizations

    routes:
      - name: identity-organizations-api
        paths:
          - /api/organizations
        strip_path: true

  - name: identity-access-grants
    url: http://identity-service:4004/access-grants

    routes:
      - name: identity-access-grants-api
        paths:
          - /api/access-grants
        strip_path: true

  # The signed-in person's own record. Separate from /api/users, which manages
  # other people and is permission-gated; this acts on the caller only.
  - name: identity-profile
    url: http://identity-service:4004/profile

    routes:
      - name: identity-profile-api
        paths:
          - /api/profile
        strip_path: true

  # assistant-service hosts the AI assistant and the MCP server. The MCP route
  # is published so external MCP clients can reach it with the same JWT.
  - name: assistant-service
    url: http://assistant-service:4007/assistant

    routes:
      - name: assistant-api
        paths:
          - /api/assistant
        strip_path: true

  - name: assistant-mcp
    url: http://assistant-service:4007/mcp

    routes:
      - name: assistant-mcp-api
        paths:
          - /api/mcp
        strip_path: true
